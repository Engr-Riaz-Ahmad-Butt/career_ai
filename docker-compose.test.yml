version: '3.9'

# Minimal compose override for running backend integration tests.
# Usage: docker compose -f docker-compose.test.yml up -d
#        cd backend && npm test

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerforge_postgres_test
    environment:
      POSTGRES_USER: careerforge
      POSTGRES_PASSWORD: careerforge
      POSTGRES_DB: careerforge_test
    ports:
      - '5433:5432'   # Different port to avoid clashing with dev DB
    tmpfs:
      - /var/lib/postgresql/data  # In-memory: fast, disposable
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerforge -d careerforge_test']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: careerforge_redis_test
    ports:
      - '6380:6379'   # Different port to avoid clashing with dev Redis
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
